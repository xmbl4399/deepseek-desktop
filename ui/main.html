<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<style>
  /* 主题变量:跟随系统深/浅色 */
  :root {
    --bar-bg: #171922;
    --bar-fg: #cfd3e6;
    --bar-active: #2a2e45;
    --bar-hover: #23273c;
    --bar-border: rgba(255, 255, 255, 0.08);
    --bar-plus: #9aa3c7;
    --view-bg: #fff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bar-bg: #f2f3f8;
      --bar-fg: #33384d;
      --bar-active: #ffffff;
      --bar-hover: #e6e8f2;
      --bar-border: rgba(0, 0, 0, 0.1);
      --bar-plus: #6b7394;
      --view-bg: #fff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  /* 输入类元素必须可选中(全局 user-select: none 会让查找条无法选中/复制) */
  input, textarea { user-select: text; -webkit-user-select: text; }
  html, body { height: 100%; overflow: hidden; background: var(--bar-bg); }
  /* 标签栏:高度/行高按 Windows 平板触摸目标(≥34px)设计,不再用桌面鼠标的 26px */
  #tabbar {
    display: flex;
    align-items: center;
    height: 46px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    padding: 0 6px;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #tabbar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 110px;
    max-width: 220px;
    height: 36px;
    padding: 0 6px 0 12px;
    border-radius: 9px;
    color: var(--bar-fg);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    background: transparent;
  }
  .tab:hover { background: var(--bar-hover); }
  .tab.active { background: var(--bar-active); color: var(--bar-fg); }
  .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    flex: none;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bar-plus);
    font-size: 15px;
    line-height: 1;
    border-radius: 6px;
  }
  .tab-close:hover { background: rgba(255, 80, 80, 0.25); color: #ff8a8a; }
  #tab-add {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--bar-plus);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #tab-add:hover { background: var(--bar-hover); }
  /* 主窗置顶按钮(与托盘"主窗置顶"同步;靠右) */
  #tab-pin {
    flex-shrink: 0;
    margin-left: auto; /* 推到标签栏最右 */
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--bar-plus);
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    opacity: 0.55;
  }
  #tab-pin:hover { background: var(--bar-hover); opacity: 1; }
  #tab-pin.active { opacity: 1; color: #4d6bfe; background: var(--bar-active); }
  /* 内容区:webview 铺满(inset 顶部必须与 #tabbar 高度一致) */
  #views { position: absolute; inset: 46px 0 0 0; background: var(--view-bg); }
  webview.tab-view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }
  webview.tab-view.active { display: flex; }
  /* 截图提问提示条 */
  #toast {
    position: absolute;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 80%;
    padding: 7px 16px;
    border-radius: 8px;
    background: var(--bar-active);
    border: 1px solid var(--bar-border);
    color: var(--bar-fg);
    font-size: 12px;
    z-index: 10;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* 页内查找条(Ctrl+F):作用于当前标签 */
  #findbar {
    position: absolute;
    top: 54px;
    right: 8px;
    z-index: 20;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--bar-active);
    border: 1px solid var(--bar-border);
  }
  #findbar.show { display: flex; }
  #find-input {
    width: 190px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--bar-border);
    border-radius: 6px;
    background: var(--bar-bg);
    color: var(--bar-fg);
    font-size: 13px;
    outline: none;
  }
  #find-input::placeholder { color: var(--bar-plus); }
  #find-count { min-width: 46px; text-align: center; color: var(--bar-plus); font-size: 11px; }
  .find-btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--bar-plus);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .find-btn:hover { background: var(--bar-hover); color: var(--bar-fg); }
  /* 标签栏右键菜单(壳层自绘;网页内容的右键菜单由主进程承接) */
  #tabmenu {
    position: absolute;
    z-index: 30;
    display: none;
    min-width: 134px;
    padding: 4px;
    border-radius: 8px;
    background: var(--bar-active);
    border: 1px solid var(--bar-border);
  }
  #tabmenu.show { display: block; }
  #tabmenu .mi {
    padding: 9px 12px;
    border-radius: 6px;
    color: var(--bar-fg);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  #tabmenu .mi:hover { background: var(--bar-hover); }
  #tabmenu .mi.off { color: var(--bar-plus); opacity: 0.5; cursor: default; }
  #tabmenu .mi.off:hover { background: transparent; }
  /* 标签页崩溃/无响应兜底 */
  .tab-crash {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--view-bg);
    color: #444441;
    font-size: 13px;
  }
  .tab-crash.show { display: flex; }
  .tab-crash button {
    padding: 6px 16px;
    border: none;
    border-radius: 8px;
    background: #4d6bfe;
    color: #ffffff;
    font-size: 13px;
    cursor: pointer;
  }
  .tab.dragging { opacity: 0.45; }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tab-add" title="新标签 (Ctrl+T)">+</div>
    <div id="tab-pin" title="主窗置顶">📌</div>
  </div>
  <div id="views"></div>
  <div id="toast"></div>
  <div id="findbar">
    <input id="find-input" type="text" placeholder="在当前页面中查找" spellcheck="false">
    <span id="find-count"></span>
    <button class="find-btn" id="find-prev" title="上一个 (Shift+Enter)">↑</button>
    <button class="find-btn" id="find-next" title="下一个 (Enter)">↓</button>
    <button class="find-btn" id="find-close" title="关闭 (Esc)">✕</button>
  </div>
  <div id="tabmenu"></div>
  <script src="main.js"></script>
</body>
</html>
