<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
    /* 舞台:填满窗口(尺寸随 DIP 自适应),translateY 落地对齐由 JS 设置 */
    #stage { position: relative; width: 100%; height: 100%; pointer-events: none; }
    /* 双缓冲 video:完全穿透,交互统一由 #hit 层负责 */
    video.pv {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; pointer-events: none; opacity: 0;
      transition: opacity .18s ease; transform-origin: center;
    }
    video.pv.is-front { opacity: 1; }
    /* 命中层:覆盖人物区域(HIT_BOX),唯一可交互区域 */
    #hit { position: absolute; pointer-events: auto; cursor: grab; z-index: 1; }
    #hit.dragging { cursor: grabbing; }
    /* 趣味气泡(抄 dsh-dafeiyu 的气泡思路:轻量文字气泡,悬在头顶)
       尺寸随鲸鱼娘缩放:字号由 JS 按 PET_W/320 设置,其余用 em 自动跟随 */
    :root {
      --bubble-bg: rgba(24, 26, 38, 0.94);
      --bubble-border: rgba(255, 255, 255, 0.12);
      --bubble-fg: #e8eaf6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bubble-bg: rgba(250, 250, 253, 0.95);
        --bubble-border: rgba(0, 0, 0, 0.12);
        --bubble-fg: #2b3045;
      }
    }
    #bubble {
      position: absolute;
      top: 0.17em;
      left: 50%;
      transform: translateX(-50%);
      max-width: 82%;
      padding: 0.42em 0.92em;
      border-radius: 0.83em;
      background: var(--bubble-bg);
      border: 0.08em solid var(--bubble-border);
      color: var(--bubble-fg);
      font-size: 12px; /* JS 按窗口尺寸缩放 */
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity .2s ease;
    }
    #bubble.show { opacity: 1; }
    /* 小尾巴(指向下方,em 随字号缩放) */
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -0.42em;
      left: 50%;
      transform: translateX(-50%);
      border: 0.42em solid transparent;
      border-top-color: var(--bubble-bg);
      border-bottom: none;
    }
    /* 轮廓投影(从背景中分离人物):用 drop-shadow 而不是径向渐变圆环。
       drop-shadow 按视频的 alpha 通道取剪影 —— 人物实体区域完全不受影响,
       只在她外侧生成一圈柔和阴影,天然贴轮廓、无硬切边,也不存在"最浓的地方
       正好糊在脸上"的问题(旧的 #halo 径向渐变就是这样,且直径 2.4x 人物宽会
       溢出窗口被 overflow:hidden 切出上下两条直线)。
       两段阴影:近处小半径压出清晰边,远处大半径铺开柔和过渡。
       颜色用纯黑低透明度,深浅背景都成立(不跟系统主题走:主题是窗口配色,
       屏幕背景是另一回事,跟错了反而帮倒忙)。 */
    :root {
      --shadow-color: rgba(0, 0, 0, 0.35);
      /* 轮廓投影半径,480x270 基准值;applySize 按窗口尺寸重算 */
      --rim-near: 9px;
      --rim-far: 27px;
      --rim-shadow-near: rgba(0, 0, 0, 0.34);
      --rim-shadow-far: rgba(0, 0, 0, 0.22);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --shadow-color: rgba(0, 0, 0, 0.18);
      }
    }
    video.pv {
      filter:
        drop-shadow(0 0 var(--rim-near) var(--rim-shadow-near))
        drop-shadow(0 0 var(--rim-far) var(--rim-shadow-far));
    }
    /* 脚下阴影(落地感) */
    #shadow {
      position: absolute;
      left: 50%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at center, var(--shadow-color) 0%, transparent 70%);
      transform: translateX(-50%);
    }
    @media (prefers-reduced-motion: reduce) { video.pv { transition: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <div id="shadow"></div>
    <video id="va" class="pv is-front" muted playsinline autoplay title="鲸鱼娘"></video>
    <video id="vb" class="pv" muted playsinline autoplay title="鲸鱼娘"></video>
    <div id="bubble"></div>
    <div id="hit"></div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
