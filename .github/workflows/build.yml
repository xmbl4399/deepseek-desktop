name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 手动触发兜底:tag 与 main 指向同一 commit 时,GH 可能只对 branch 生成 run,
  # 此时从 Actions 页手动触发并勾选 release 即可构建发布
  workflow_dispatch:
    inputs:
      release:
        description: '构建并发布 Release(需已打 v* tag)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-win:
    # 仅打 tag 时构建安装包并发到 GitHub Release(或手动触发)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never:避免 electron-builder 见到 GH_TOKEN+publish 配置后自行尝试发 GitHub Release 导致失败
      # (发版统一由下方 action-gh-release 完成)
      - run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
